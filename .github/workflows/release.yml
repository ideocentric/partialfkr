name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rebuild and re-upload artifacts for (e.g. v0.1.2)'
        required: true
        type: string

# Linux packages, Windows installers (unsigned), and the user manual PDF are uploaded
# to the draft release automatically.
#
# The macOS notarized DMG is NOT built in CI — it needs the Developer ID signing
# certificate and Apple notarization credentials, which live only on the maintainer's
# Mac (scripts/distribute.sh, credentials in a gitignored .env). The `macos-manual-step`
# job below prints the exact command to run locally so the release flow never leaves it
# implicit. Run that command, then publish the draft.

permissions:
  contents: write

jobs:
  # ── Create draft release ──────────────────────────────────────────────────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - id: vars
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create draft release (no-op if already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            --draft \
            --title "PartialFKR ${{ steps.vars.outputs.tag }}" \
            --generate-notes \
          || echo "Release ${{ steps.vars.outputs.tag }} already exists — skipping creation."

  # ── User manual ──────────────────────────────────────────────────────────────
  # Uploads docs/MANUAL.pdf to the draft release immediately after it is created.
  upload-manual:
    name: Upload user manual
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Upload user manual to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            docs/MANUAL.pdf \
            --clobber

  # ── Linux packages ────────────────────────────────────────────────────────────
  # Builds .deb and .rpm for x86_64 and arm64, uploads directly to the draft release.
  build-linux:
    name: Linux ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            rpm \
            libasound2-dev \
            libx11-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxext-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libglu1-mesa-dev \
            libgl1-mesa-dev \
            mesa-common-dev \
            libgtk-3-dev

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: linux-${{ matrix.arch }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: linux-${{ matrix.arch }}-deps-

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        working-directory: build
        run: cpack

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" \
            build/PartialFKR-*.deb \
            build/PartialFKR-*.rpm \
            --clobber

  # ── Windows installers ────────────────────────────────────────────────────────
  # Builds NSIS installers for x86_64 and arm64, uploads to draft release.
  #
  # Authenticode signing via SignPath.io is staged but INERT until the repo secret
  # SIGNPATH_API_TOKEN and the repo variable SIGNPATH_ORGANIZATION_ID are set. Until
  # then the signing steps are skipped and installers ship unsigned (SmartScreen warns
  # on first launch). Once SignPath approves the open-source project and both values
  # are configured, the app binary is signed before packaging and the installer is
  # signed after — no further workflow edits needed. See docs/DISTRIBUTION.md § Windows.
  build-windows:
    name: Windows ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    # Mirror the secret/variable into env so step-level `if:` guards can test them —
    # the `secrets` context is not available in `if:` conditions, but `env` is.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            name: x86_64
          - runner: windows-11-arm
            arch: ARM64
            name: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Cache build dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: windows-${{ matrix.name }}-release-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: windows-${{ matrix.name }}-release-deps-

      - name: Configure
        # Let CMake pick the newest Visual Studio the runner actually ships, rather than
        # hardcoding a version — the floating windows-latest image drops older VS toolsets
        # over time. -A still selects the target architecture (x64 / ARM64).
        run: cmake -B build -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # ── App-binary signing (skipped until SignPath is configured) ─────────────
      # The app .exe must be signed BEFORE cpack so the installer bundles the signed
      # binary. The signed exe is downloaded back into its build location in place.
      - name: Upload unsigned app binary for signing
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.name }}
          path: build\PartialFKR_artefacts\Release\PartialFKR.exe

      - name: Sign app binary
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://app.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PartialFKR
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          # Overwrite the unsigned exe in place so cpack packages the signed one.
          output-artifact-directory: build\PartialFKR_artefacts\Release

      - name: Install NSIS
        run: choco install nsis -y

      - name: Package
        working-directory: build
        run: cpack -C Release

      # ── Installer signing (skipped until SignPath is configured) ──────────────
      - name: Upload unsigned installer for signing
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.name }}
          path: build\PartialFKR-*-Windows-*.exe

      - name: Sign installer
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          connector-url: https://app.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PartialFKR
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          # Overwrite the unsigned installer in place before the release upload.
          output-artifact-directory: build

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag }}" `
            (Get-ChildItem build\PartialFKR-*.exe).FullName `
            --clobber
        shell: pwsh

  # ── macOS — manual step ───────────────────────────────────────────────────────
  # The macOS DMG cannot be built here: it requires the Developer ID certificate and
  # Apple notarization credentials, which never leave the maintainer's Mac. This job
  # does no building — it surfaces a prominent prompt (run summary + a notice
  # annotation) with the exact command to run locally, so the release is never
  # "done" without a conscious macOS step.
  macos-manual-step:
    name: macOS DMG (build locally)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Prompt maintainer to build and upload the macOS DMG
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          MSG="macOS DMG is not built in CI. On your Mac, from the repo root, run: ./scripts/distribute.sh — it builds the universal binary, signs, notarizes, staples, creates the DMG, and uploads it to draft release ${TAG}. Then publish: gh release view ${TAG} --web"
          echo "::notice title=macOS DMG — manual step required::${MSG}"
          {
            echo "## 🍎 macOS DMG — manual step required"
            echo ""
            echo "CI built the Linux, Windows, and manual assets. The **macOS notarized DMG** must be built on your Mac (it needs the Developer ID + notarization credentials that live only there)."
            echo ""
            echo "From the repo root, on your Mac:"
            echo ""
            echo '```bash'
            echo "./scripts/distribute.sh"
            echo '```'
            echo ""
            echo "That signs, notarizes, staples, packages, and uploads the DMG to draft release \`${TAG}\`. Then review and publish:"
            echo ""
            echo '```bash'
            echo "gh release view ${TAG} --web"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"